name: Build Python Wheel

on:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    env:
      BACKEND_DIR: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
        working-directory: ${{ env.BACKEND_DIR }}
      - name: Build frontend assets
        run: |
          # Build the frontend assets first
          python build.py
        working-directory: ${{ env.BACKEND_DIR }}
      - name: Build universal wheel
        run: |
          # Temporarily disable the build script and build universal wheel
          sed -i.bak '/\[tool.poetry.build\]/,+1d' pyproject.toml
          poetry build -f wheel
          
          # Restore the build script
          mv pyproject.toml.bak pyproject.toml
          
          # Check what was built
          ls -la dist/
          echo "Universal wheel built successfully!"
        working-directory: ${{ env.BACKEND_DIR }}
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: chainlit-wheel
          path: backend/dist/*.whl
